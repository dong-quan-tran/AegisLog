source_type: generic_jsonl
fields:
  timestamp:
    - "@timestamp"
    - "time"
    - "ts"
  message:
    - "msg"
    - "event_message"
  severity:
    - "level"
    - "log_level"
  user:
    - "username"
    - "account"
  src_ip:
    - "client_ip"
    - "ip"
  host:
    - "hostname"
    - "server"
  service:
    - "app"
    - "application"
  event_category:
    - "category"
    - "event_type"
  event_action:
    - "action"
    - "operation"
  session_hint:
    - "session_id"
    - "trace_id"
    - "request_id"
defaults:
  event_category: auth